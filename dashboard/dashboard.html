<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Jev X Scanner — Dashboard</title>
<link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <main class="wrap">
    <h1>Jev X Scanner — Dashboard</h1>
    <p id="summary" class="summary"></p>

    <section class="controls">
      <div class="filter-group" role="group" aria-label="Filter by label">
        <button type="button" class="filter-btn active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="breaking">⚡ Breaking</button>
        <button type="button" class="filter-btn" data-filter="golden_nugget">🪙 Golden Nugget</button>
        <button type="button" class="filter-btn" data-filter="ai_slop">🤖 AI Slop</button>
      </div>

      <div class="sort-group">
        <label class="field-label" for="sort-select">Sort by</label>
        <select id="sort-select">
          <option value="newest">Newest first</option>
          <option value="engagement">Total engagement</option>
        </select>
      </div>
    </section>

    <section id="table-section" class="card">
      <table id="posts-table">
        <thead>
          <tr>
            <th>Label</th>
            <th>Post</th>
            <th>Link</th>
            <th>Engagement</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="posts-tbody"></tbody>
      </table>
      <p id="empty-state" class="empty-state" hidden>
        No posts classified yet — browse X and Jev X Scanner will start filling this in.
      </p>
    </section>
  </main>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
